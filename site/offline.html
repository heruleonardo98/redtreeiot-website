<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .offline { min-height: 100vh; display: grid; place-items: center; padding: var(--gutter); }
    .offline-in { max-width: 34rem; display: grid; gap: 18px; }
    .offline h1 { font-size: var(--h2); font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; }
    .offline p { font-size: var(--lead); }
    .offline .ctas { margin-top: 8px; }
  </style>
</head>
<body>
  <main class="offline">
    <div class="offline-in">
      <a class="logo" href="/">
        <svg class="logo-mark" width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 54V14"/><path d="M32 44L18 30V22"/><path d="M32 44L46 30V22"/><path d="M32 32L24 24"/><path d="M32 32L40 24"/></g><g fill="currentColor"><circle cx="32" cy="9" r="5"/><circle cx="18" cy="17" r="5"/><circle cx="46" cy="17" r="5"/><circle cx="32" cy="58" r="5"/></g></svg>
        <span>RedTree IoT</span>
      </a>
      <h1>Anda sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat Anda. Periksa sinyal atau Wi-Fi, lalu coba lagi. Anda tetap bisa menelepon kami.</p>
      <div class="ctas">
        <button class="btn btn-red" type="button" onclick="location.reload()">Coba lagi</button>
        <a class="btn btn-tint" href="tel:+6282272226678">Telepon +62 822-7222-6678</a>
      </div>
    </div>
  </main>
</body>
</html>
